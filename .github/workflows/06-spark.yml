# Boots the platform without the ClickHouse cluster, builds the Spark image
# and the job images, starts the cluster, and checks that it is usable rather
# than merely running.
#
# The transformation itself needs data in s3://raw/, which is produced by a
# job that reads ClickHouse — absent here. That check prints as SKIP; see
# "What continuous integration does not cover" in 06-spark/README.md.

name: 06-spark

on:
  push:
    branches: [main]
    paths:
      - '06-spark/**'
      - '05-minio/**'
      - '04-etl/**'
      - '03-dbms/**'
      - '02-monitoring/**'
      - '01-kafka/**'
      - '.github/workflows/06-spark.yml'
  pull_request:
    paths:
      - '06-spark/**'
      - '05-minio/**'
      - '04-etl/**'
      - '03-dbms/**'
      - '02-monitoring/**'
      - '01-kafka/**'
      - '.github/workflows/06-spark.yml'
  workflow_dispatch:

concurrency:
  group: 06-spark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: 06-spark

    env:
      PROFILES: ""

    steps:
      - uses: actions/checkout@v5

      - name: Show Docker versions and memory
        run: |
          docker compose version
          free -h

      - name: Prepare .env files for CI
        run: |
          cp .env.example .env
          cp ../05-minio/.env.example ../05-minio/.env
          cp ../04-etl/.env.example ../04-etl/.env
          cp ../03-dbms/.env.example ../03-dbms/.env
          cp ../02-monitoring/.env.example ../02-monitoring/.env
          cp ../01-kafka/.env.example ../01-kafka/.env
          # The gid owning the Docker socket. A fixed value does not travel:
          # 0 on Docker Desktop, the `docker` group on a runner. Getting it
          # wrong makes docker_sd discover nothing at all, silently.
          sed -i "s/^DOCKER_GID=.*/DOCKER_GID=$(stat -c '%g' /var/run/docker.sock)/" ../02-monitoring/.env
          sed -i 's/^KAFKA_HEAP_OPTS=.*/KAFKA_HEAP_OPTS=-Xms256m -Xmx512m/' ../01-kafka/.env
          sed -i 's/^KAFKA_MEM_LIMIT=.*/KAFKA_MEM_LIMIT=1500m/' ../01-kafka/.env
          sed -i 's/^CONNECT_HEAP_OPTS=.*/CONNECT_HEAP_OPTS=-Xms256m -Xmx768m/' ../03-dbms/.env
          # Four workers at 8 GiB is 32 GiB, which is a workstation figure.
          # The checks are about there being four separate executors, not
          # about how much each holds.
          sed -i 's/^SPARK_WORKER_MEMORY=.*/SPARK_WORKER_MEMORY=1g/' .env
          sed -i 's/^SPARK_EXECUTOR_MEMORY=.*/SPARK_EXECUTOR_MEMORY=512m/' .env

      - name: Validate the compose file and every include
        run: make config

      # ----------------------------------------------------------------------
      #  Build before pulling, and pull before starting
      # ----------------------------------------------------------------------
      #  `docker compose up --build` looks like it covers this and does not.
      #  It pulls every image that has no build section of its own — and three
      #  images in this platform are built by one service and merely
      #  referenced by another. jmx-connect in 03-dbms names
      #  dataplatform/jmx-exporter, which jmx-kafka-* in 02-monitoring builds;
      #  from compose's point of view that is an image to fetch from a
      #  registry where it has never existed:
      #
      #      pull access denied for dataplatform/jmx-exporter,
      #      repository does not exist or may require 'docker login'
      #
      #  Locally this never appears, because the image is already there from
      #  an earlier build. It only shows up on a clean machine, which is
      #  precisely what a runner is.
      #
      #  Building everything buildable first puts those images in the local
      #  store, so the later pull skips them.
      # ----------------------------------------------------------------------
      - name: Build every locally built image
        run: docker compose build

      # ----------------------------------------------------------------------
      #  Anonymous pulls from Docker Hub fail intermittently on runners — rate
      #  limits and transient auth errors both surface as "pull access denied
      #  ... repository does not exist", which reads like a typo in the image
      #  name rather than a temporary condition.
      #
      #  --ignore-buildable skips what the previous step already built.
      # ----------------------------------------------------------------------
      - name: Pull the external images, with retries
        run: |
          for attempt in 1 2 3; do
            if docker compose pull --ignore-buildable; then
              echo "pulled on attempt ${attempt}"
              exit 0
            fi
            echo "pull attempt ${attempt} failed, retrying in 20s"
            sleep 20
          done
          echo "could not pull the external images after three attempts"
          exit 1

      # Built FROM the cluster image, so this must follow the build above. Out
      # of order, the job images inherit a stale Spark and the driver and
      # executors disagree — which surfaces as ClassCastException on
      # SerializedLambda, naming neither versions nor images.
      - name: Build the job images
        run: make jobs

      - name: Start the platform and the Spark cluster
        run: make up-light

      - name: Smoke test
        run: make smoke

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          echo "=== container status ==="
          docker compose ps -a
          echo ""
          echo "=== memory ==="
          free -h
          echo ""
          echo "=== images present locally ==="
          docker images --format '{{.Repository}}:{{.Tag}}' | sort | head -40
          echo ""
          echo "=== the master's view ==="
          curl -s http://localhost:8090/json/ || true
          echo ""
          echo "=== jars on a worker ==="
          docker compose exec -T spark-worker-1 ls /opt/spark/jars | grep -E 'hadoop|aws|cloud' || true
          echo ""
          echo "=== master, last 40 lines ==="
          docker compose logs --no-color --tail=40 spark-master || true
          echo ""
          echo "=== worker 1, last 30 lines ==="
          docker compose logs --no-color --tail=30 spark-worker-1 || true
          echo ""
          echo "=== what prometheus discovered ==="
          curl -s 'http://localhost:9090/api/v1/targets?state=active' \
            | grep -o '"job":"[^"]*"' | sort | uniq -c || true

      - name: Tear down
        if: always()
        run: make clean
