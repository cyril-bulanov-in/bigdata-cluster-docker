# Builds the Superset image and starts it with its metadata database, Redis
# and its StatsD exporter — without the rest of the platform.
#
# Deliberately narrower than the lower workflows. Superset needs nothing from
# Kafka, ClickHouse or Spark to prove it works: it needs its own Postgres, its
# drivers, and its schema. Starting seven other stacks to reach those checks
# would spend twenty minutes on nothing.
#
# What that costs is the datasets, the dashboard and the metric checks, all of
# which need something this workflow does not start. They print as SKIP; see
# "What continuous integration does not cover" in 08-superset/README.md.

name: 08-superset

on:
  push:
    branches: [main]
    paths:
      - '08-superset/**'
      - '.github/workflows/08-superset.yml'
  pull_request:
    paths:
      - '08-superset/**'
      - '.github/workflows/08-superset.yml'
  workflow_dispatch:

concurrency:
  group: 08-superset-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: 08-superset

    env:
      # ----------------------------------------------------------------------
      #  No warehouse here, so the dataset step is deliberately not run
      # ----------------------------------------------------------------------
      #  Registering the connection is writing a string. Registering a dataset
      #  means asking ClickHouse what columns a mart has, and the dashboard
      #  needs the datasets.
      #
      #  Only the four Superset services start here, so there is nothing to
      #  ask and the step fails on name resolution:
      #
      #      Failed to resolve 'clickhouse-01' ...
      #      Temporary failure in name resolution
      #
      #  Skipping it explicitly keeps the difference between "could not" and
      #  "chose not to" visible. Wrapping it in `|| true` would hide a real
      #  failure just as quietly.
      # ----------------------------------------------------------------------
      SUPERSET_SKIP_DATASETS: 1

    steps:
      - uses: actions/checkout@v5

      # Anonymous pulls from Docker Hub are limited per IP and runner IPs are
      # shared. A rate limit surfaces as "repository does not exist" on a name
      # that is plainly correct, and it lands on a different image each time.
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Show Docker versions and memory
        run: |
          docker compose version
          free -h

      # Only this stack's own .env. Nothing from the lower stacks is started,
      # so their files are never read.
      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i 's/^SUPERSET_SKIP_DATASETS=.*/SUPERSET_SKIP_DATASETS=1/' .env

      # ----------------------------------------------------------------------
      #  Build before starting, not as part of starting
      # ----------------------------------------------------------------------
      #  `up --build` builds and pulls concurrently, and the superset service
      #  names dataplatform/superset without a build section of its own — only
      #  superset-init has one. From Compose's point of view that is an image
      #  to fetch from a registry where it has never existed:
      #
      #      pull access denied for dataplatform/superset,
      #      repository does not exist or may require 'docker login'
      #
      #  which reads as an authentication problem and is not. The same thing
      #  happened in step 6 with dataplatform/jmx-exporter.
      #
      #  The build asserts that all three drivers import from the venv
      #  Superset runs from, so a package installed into the wrong interpreter
      #  fails here rather than minutes later in a different container — which
      #  is how psycopg2 and statsd were each missing in turn.
      # ----------------------------------------------------------------------
      - name: Build the Superset image
        run: docker compose build superset-init

      # The exporter starts too. It needs nothing from the warehouse, and its
      # absence would make the metric checks skip for the wrong reason.
      - name: Start Superset, its database, Redis and the exporter
        run: |
          for attempt in 1 2 3; do
            if docker compose up -d \
                 superset-postgres superset-redis superset-statsd \
                 superset-init superset; then
              echo "started on attempt ${attempt}"
              exit 0
            fi
            echo "attempt ${attempt} failed, retrying in 30s"
            sleep 30
          done
          echo "could not start after three attempts"
          exit 1

      - name: Smoke test
        run: make smoke

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          echo "=== container status ==="
          docker compose ps -a
          echo ""
          echo "=== memory ==="
          free -h
          echo ""
          echo "=== drivers, from the venv Superset runs from ==="
          # All three, and through that interpreter specifically. A package
          # installed with the system pip lands outside the venv and is
          # invisible to the application while plainly present on disk.
          docker run --rm --entrypoint /app/.venv/bin/python \
            dataplatform/superset:$(grep -E '^SUPERSET_VERSION=' .env | cut -d= -f2) \
            -c "import psycopg2, clickhouse_connect, statsd; print('psycopg2', psycopg2.__version__, '| clickhouse-connect', clickhouse_connect.__version__, '| statsd', statsd.__version__)" || true
          echo ""
          echo "=== what the exporter is publishing ==="
          # Superset emits over StatsD and serves no Prometheus endpoint, so
          # this is the only place its metrics exist. An empty list means
          # either nobody has used Superset yet or STATS_LOGGER is unset.
          docker compose exec -T superset-statsd \
            wget -qO- http://localhost:9102/metrics 2>/dev/null \
            | grep -o '^superset_[a-z_]*' | sort -u | head -20 || true
          echo ""
          echo "=== superset-init, in full ==="
          docker compose logs --no-color superset-init || true
          echo ""
          echo "=== superset, last 50 lines ==="
          docker compose logs --no-color --tail=50 superset || true

      - name: Tear down
        if: always()
        run: docker compose down -v
