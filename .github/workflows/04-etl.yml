# Boots the platform without the ClickHouse cluster and checks that Airflow is
# usable rather than merely running: the four components up, the DAGs parsed,
# the job images present, metrics flowing, and the jobs producing output.
#
# The warehouse checks print as SKIP; see "What continuous integration does
# not cover" in 04-etl/README.md.

name: 04-etl

on:
  push:
    branches: [main]
    paths:
      - '04-etl/**'
      - '03-dbms/**'
      - '02-monitoring/**'
      - '01-kafka/**'
      - '.github/workflows/04-etl.yml'
  pull_request:
    paths:
      - '04-etl/**'
      - '03-dbms/**'
      - '02-monitoring/**'
      - '01-kafka/**'
      - '.github/workflows/04-etl.yml'
  workflow_dispatch:

concurrency:
  group: 04-etl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    defaults:
      run:
        working-directory: 04-etl

    env:
      PROFILES: ""
      SKIP_CLICKHOUSE: 1

    steps:
      - uses: actions/checkout@v5

      # Anonymous pulls from Docker Hub are limited per IP and runner IPs are
      # shared. A rate limit surfaces as "repository does not exist" on a name
      # that is plainly correct, and it lands on a different image each time.
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Show Docker versions and memory
        run: |
          docker compose version
          free -h

      - name: Prepare .env files for CI
        run: |
          cp .env.example .env
          cp ../03-dbms/.env.example ../03-dbms/.env
          cp ../02-monitoring/.env.example ../02-monitoring/.env
          cp ../01-kafka/.env.example ../01-kafka/.env
          # ------------------------------------------------------------------
          #  The gid that owns the Docker socket, in TWO files
          # ------------------------------------------------------------------
          #  Prometheus needs it in 02-monitoring to read the socket for
          #  service discovery. The Airflow scheduler needs it here, because
          #  DockerOperator starts containers through the same socket.
          #
          #  A fixed value does not travel: on Docker Desktop the socket is
          #  root:root and group 0 works; on a runner it is root:docker with a
          #  gid around 999, where group 0 grants nothing.
          #
          #  This passed once by luck — the default of 0 happened to work on
          #  that runner. It is not a property to rely on.
          # ------------------------------------------------------------------
          DOCKER_GID=$(stat -c '%g' /var/run/docker.sock)
          sed -i "s/^DOCKER_GID=.*/DOCKER_GID=${DOCKER_GID}/" ../02-monitoring/.env
          grep -q '^DOCKER_GID=' .env \
            && sed -i "s/^DOCKER_GID=.*/DOCKER_GID=${DOCKER_GID}/" .env \
            || echo "DOCKER_GID=${DOCKER_GID}" >> .env
          echo "docker socket gid: ${DOCKER_GID}"
          # Lower the JVM limits, leave every image version as pinned.
          sed -i 's/^KAFKA_HEAP_OPTS=.*/KAFKA_HEAP_OPTS=-Xms256m -Xmx512m/' ../01-kafka/.env
          sed -i 's/^KAFKA_MEM_LIMIT=.*/KAFKA_MEM_LIMIT=1500m/' ../01-kafka/.env
          sed -i 's/^CONNECT_HEAP_OPTS=.*/CONNECT_HEAP_OPTS=-Xms256m -Xmx768m/' ../03-dbms/.env

      - name: Validate the compose file and every include
        run: make config

      # Three images in this platform are built by one service and merely
      # referenced by another, so `up --build` tries to pull them from a
      # registry where they have never existed. Building first puts them in
      # the local store; `up` then fetches only what is genuinely missing.
      - name: Build every locally built image
        run: docker compose build

      - name: Start the platform and Airflow
        run: |
          for attempt in 1 2 3; do
            if make up-light; then
              echo "started on attempt ${attempt}"
              exit 0
            fi
            echo "attempt ${attempt} failed, retrying in 30s"
            sleep 30
          done
          echo "could not start after three attempts"
          exit 1

      - name: Smoke test, without the warehouse
        run: make smoke

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          echo "=== container status ==="
          docker compose ps -a
          echo ""
          echo "=== memory ==="
          free -h
          echo ""
          echo "=== docker socket ==="
          ls -l /var/run/docker.sock
          echo ""
          echo "=== DAG import errors ==="
          docker compose exec -T airflow-scheduler airflow dags list-import-errors || true
          echo ""
          echo "=== DAGs ==="
          docker compose exec -T airflow-scheduler airflow dags list -o plain || true
          echo ""
          echo "=== job images ==="
          docker images --filter 'reference=dataplatform/job-*' || true
          echo ""
          echo "=== scheduler, last 40 lines ==="
          docker compose logs --no-color --tail=40 airflow-scheduler || true
          echo ""
          echo "=== api-server, last 20 lines ==="
          docker compose logs --no-color --tail=20 airflow-apiserver || true

      - name: Tear down
        if: always()
        run: make clean
