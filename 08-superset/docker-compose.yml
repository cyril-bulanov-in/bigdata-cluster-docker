# ============================================================================
#  PLATFORM — step 8: dashboards
# ============================================================================
#
#  Superset with its own metadata database, a Redis for caching, a StatsD
#  exporter for metrics, and a connection, datasets and dashboard all built
#  from files rather than clicked into the UI.
#
#  Start:  make up
#  UI:     http://localhost:8089
#
# ----------------------------------------------------------------------------
#  Port 8089, not Superset's default 8088
# ----------------------------------------------------------------------------
#  8088 is the dbt documentation site from step 7. Moving that would mean
#  editing a README that already tells people where to look, so Superset moves
#  instead. Inside the container it still listens on 8088.
# ----------------------------------------------------------------------------
include:
  - ../07-dbt/docker-compose.yml

name: platform

services:

  # ==========================================================================
  #  Superset's metadata database
  # ==========================================================================
  #  Not the operational Postgres in 03-dbms, and not Airflow's.
  #
  #  Superset writes constantly: every dashboard edit, every saved query,
  #  every query log entry. None of that belongs in a database being captured
  #  by Debezium, and none of it should share a schema migration with another
  #  tool.
  # ==========================================================================
  superset-postgres:
    image: postgres:${POSTGRES_VERSION}
    container_name: superset-postgres
    restart: unless-stopped
    networks: [dataplatform]
    environment:
      POSTGRES_DB: ${SUPERSET_DB_NAME}
      POSTGRES_USER: ${SUPERSET_DB_USER}
      POSTGRES_PASSWORD: ${SUPERSET_DB_PASSWORD}
    volumes:
      - superset-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SUPERSET_DB_USER} -d ${SUPERSET_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ==========================================================================
  #  Redis, for caching only
  # ==========================================================================
  #  Four caches: chart data, query results, dashboard filter state, explore
  #  form state.
  #
  #  Filter state is the one that matters most and is easiest to overlook.
  #  Without a backing store Superset keeps it in the metadata database, and
  #  the UI grows slower with every dashboard interaction — which reads as
  #  Superset being slow rather than as a cache that was never configured.
  #
  #  No Celery worker: that is for running long queries in the background, and
  #  the marts this reads answer in milliseconds.
  # ==========================================================================
  superset-redis:
    image: redis:${REDIS_VERSION}
    container_name: superset-redis
    restart: unless-stopped
    networks: [dataplatform]
    # No volume. Everything here is a cache — losing it costs one slow page
    # load, and persisting it would mean a stale filter surviving a rebuild.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    labels:
      # No Prometheus endpoint either. SupersetCacheDown watches the container
      # through cAdvisor, the same way SupersetDown watches Superset itself.
      prometheus.scrape: "false"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  # ==========================================================================
  #  StatsD to Prometheus
  # ==========================================================================
  #  Superset speaks StatsD, like Airflow and unlike everything else here.
  #
  #  Its own exporter rather than sharing the one in 04-etl. One container
  #  more, and worth it: the two tools name things differently, and a shared
  #  mapping file would interleave their conventions until nobody could tell
  #  which rule belonged to which.
  #
  #  Discovered by label, like every exporter since 02-monitoring.
  # ==========================================================================
  superset-statsd:
    image: prom/statsd-exporter:${STATSD_EXPORTER_VERSION}
    container_name: superset-statsd
    restart: unless-stopped
    networks: [dataplatform]
    command:
      - '--statsd.mapping-config=/etc/statsd/mapping.yml'
      - '--statsd.listen-udp=:9125'
      - '--web.listen-address=:9102'
    volumes:
      - ./statsd/mapping.yml:/etc/statsd/mapping.yml:ro
    labels:
      prometheus.scrape: "true"
      prometheus.port: "9102"
      prometheus.job: "superset-statsd"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9102/metrics >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 15s

  # ==========================================================================
  #  One-shot: migrate, create the admin, register everything
  # ==========================================================================
  #  Four steps that must run in order and must finish before the web process.
  #
  #  `superset init` is the one people miss: it creates the default roles and
  #  permissions, and without it the UI loads, login succeeds, and every page
  #  is forbidden — an authenticated admin with rights to nothing.
  #
  #  register.sh comes last, because it needs the schema and the roles. It is
  #  idempotent, so running it on every start costs nothing and means a fresh
  #  volume comes back with the warehouse connected, its marts registered and
  #  the dashboard built.
  # ==========================================================================
  superset-init:
    build:
      context: .
      dockerfile: superset/Dockerfile
      args:
        SUPERSET_VERSION: ${SUPERSET_VERSION}
    image: dataplatform/superset:${SUPERSET_VERSION}
    container_name: superset-init
    restart: "no"
    networks: [dataplatform]
    environment: &superset-env
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_DB_NAME: ${SUPERSET_DB_NAME}
      SUPERSET_DB_USER: ${SUPERSET_DB_USER}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD}
      REDIS_HOST: superset-redis
      # Where Superset looks for superset_config.py. It imports the module
      # rather than reading a path, so the directory goes on PYTHONPATH and
      # the file has to be named exactly this.
      PYTHONPATH: /app/pythonpath
      # ---- metrics --------------------------------------------------------
      # StatsD is fire-and-forget over UDP: Superset does not notice whether
      # anything is listening, so a missing exporter costs nothing at runtime
      # and shows up only as an absence in Grafana.
      SUPERSET_STATSD_ENABLED: "1"
      SUPERSET_STATSD_HOST: superset-statsd
      SUPERSET_STATSD_PORT: "9125"
      SUPERSET_STATSD_PREFIX: superset
      # ---- what register.sh and the scripts read --------------------------
      SUPERSET_CLICKHOUSE_NAME: ${SUPERSET_CLICKHOUSE_NAME}
      SUPERSET_DASHBOARD_TITLE: ${SUPERSET_DASHBOARD_TITLE}
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST}
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_MARTS_DB: ${CLICKHOUSE_MARTS_DB}
      # Registering the connection is writing a string. Registering a dataset
      # means asking ClickHouse what columns a mart has, and the dashboard
      # needs the datasets — so both are skipped where there is no warehouse,
      # deliberately rather than by swallowing the error.
      SUPERSET_SKIP_DATASETS: ${SUPERSET_SKIP_DATASETS:-0}
    volumes: &superset-volumes
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./superset/register.sh:/app/register.sh:ro
      - ./superset/datasets.py:/app/datasets.py:ro
      - ./superset/dashboard.py:/app/dashboard.py:ro
    command:
      - /bin/sh
      - -c
      - |
        set -e
        superset db upgrade
        superset fab create-admin \
          --username "${SUPERSET_ADMIN_USER}" \
          --firstname Admin --lastname User \
          --email "${SUPERSET_ADMIN_EMAIL}" \
          --password "${SUPERSET_ADMIN_PASSWORD}" || true
        superset init
        sh /app/register.sh
    depends_on:
      superset-postgres:
        condition: service_healthy
      superset-redis:
        condition: service_healthy

  # ==========================================================================
  #  The web process
  # ==========================================================================
  superset:
    image: dataplatform/superset:${SUPERSET_VERSION}
    container_name: superset
    restart: unless-stopped
    networks: [dataplatform]
    environment: *superset-env
    volumes: *superset-volumes
    ports:
      - "${SUPERSET_PORT}:8088"
    labels:
      # ----------------------------------------------------------------------
      #  Not scraped, and that is deliberate
      # ----------------------------------------------------------------------
      #  Superset serves no Prometheus endpoint. Everything it reports goes
      #  out over StatsD to the exporter above.
      #
      #  Pointing docker-sd at /health looks like a way to get a liveness
      #  signal and is a trap: that endpoint returns the word OK, not
      #  exposition format, so Prometheus marks the target down on a parse
      #  error. `up{job="superset"}` would then be permanently zero and the
      #  alert would fire for ever — which is worse than having no alert,
      #  because it trains people to ignore the one that matters.
      #
      #  Liveness comes from cAdvisor instead, which has watched every
      #  container since step 2. See SupersetDown in the rules file.
      # ----------------------------------------------------------------------
      prometheus.scrape: "false"
    depends_on:
      superset-init:
        condition: service_completed_successfully
    healthcheck:
      # /health is served before Superset has finished loading its metadata,
      # so this says the process is alive rather than that the UI works. The
      # smoke test checks something stronger.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8088/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  superset-postgres-data:
