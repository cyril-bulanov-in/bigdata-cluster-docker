# ============================================================================
#  Defaults for every node and every job in this cluster
# ============================================================================
#  Baked into the image rather than mounted, so a job submitted from anywhere
#  gets the same settings. Anything environment-specific — the endpoint, the
#  keys — is passed at submit time instead; see the job images.
# ============================================================================

# ---- S3A ------------------------------------------------------------------
# The implementation class. Without this, s3a:// paths fail with "No
# FileSystem for scheme: s3a", which reads like a missing feature rather than
# a missing line of configuration.
spark.hadoop.fs.s3a.impl                     org.apache.hadoop.fs.s3a.S3AFileSystem

# Path-style addressing. The AWS default puts the bucket in the hostname —
# bucket.s3.amazonaws.com — and MinIO is reached by a service name with no
# wildcard DNS behind it, so bucket.minio does not resolve. The failure names
# a host nobody typed.
spark.hadoop.fs.s3a.path.style.access        true

# MinIO speaks plain HTTP inside the docker network. On AWS this becomes true
# and the endpoint changes; nothing else does.
spark.hadoop.fs.s3a.connection.ssl.enabled   false

# Credentials come from the environment, not from a config file. That is what
# lets the same image run against MinIO here and against S3 with an instance
# role there, with no edit.
spark.hadoop.fs.s3a.aws.credentials.provider org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

# ---- Committing output ----------------------------------------------------
#  The default committer renames files into place when a job finishes, and S3
#  has no rename: it is a copy plus a delete, per file, with no atomicity. On
#  a large write that is slow, and if the job dies halfway it leaves a
#  directory that is neither the old result nor the new one.
#
#  Of the S3A committers, `partitioned` rather than `directory`, and the
#  distinction matters for how a re-run behaves.
#
#  `directory` treats the whole output path as one unit. Its conflict modes
#  apply to everything under it, and it rejects Spark's
#  partitionOverwriteMode=dynamic outright:
#
#      PathOutputCommitter does not support dynamicPartitionOverwrite
#
#  `partitioned` resolves conflicts per partition directory. With
#  conflict-mode=replace, re-running one day replaces that day's partition and
#  leaves every other day alone — which is exactly what dynamic partition
#  overwrite means, achieved in the committer rather than by a Spark option.
#
#  The trade: it only works for writes that use partitionBy. An unpartitioned
#  write with this committer behaves like `directory`.
#
#  Note that the job must NOT also set partitionOverwriteMode=dynamic. Asking
#  for both is what produces the error above.
# The magic committer, not one of the staging committers, and the reason is
# containers.
#
# Both staging committers — `directory` and `partitioned` — write metadata
# about their uploaded parts into a local directory and expect the driver and
# every executor to see the same one. Here those are three separate containers
# with three separate filesystems, so the executors stage their work somewhere
# the driver never looks. The job then succeeds, writes _SUCCESS, and leaves
# the bucket empty of data — which is worse than failing.
#
# `magic` keeps nothing locally. Executors write straight to S3 as multipart
# uploads and leave their completion markers in the bucket itself, so there is
# no shared path to arrange. It needs a store with consistent listings, which
# S3 has had since 2020 and MinIO always did.
spark.hadoop.fs.s3a.committer.name                    magic
spark.hadoop.fs.s3a.committer.magic.enabled           true
spark.sql.sources.commitProtocolClass                 org.apache.spark.internal.io.cloud.PathOutputCommitProtocol
spark.sql.parquet.output.committer.class              org.apache.spark.internal.io.cloud.BindingParquetOutputCommitter

# Those two class names live in spark-hadoop-cloud, an optional module that is
# published separately and is in no official Spark image. It is downloaded in
# the Dockerfile alongside hadoop-aws. Without it the cluster starts, reads S3
# perfectly, and fails only on the first write.

# ---- Metrics --------------------------------------------------------------
# Spark has served Prometheus metrics natively since 3.0, so no exporter is
# needed — the same arrangement as ClickHouse and MinIO.
spark.ui.prometheus.enabled                  true

# ---- Sensible defaults for a laptop cluster -------------------------------
# Shuffle partitions default to 200, which on this much data means 200 tasks
# doing almost nothing and a lot of overhead.
spark.sql.shuffle.partitions                 8
spark.sql.adaptive.enabled                   true

# Event logs, so a finished job can still be inspected. Without this the Spark
# UI forgets an application the moment it ends, which is exactly when you want
# to look at it. The directory is created in the Dockerfile: Spark checks for
# it and refuses to start the context if it is absent.
spark.eventLog.enabled                       true
spark.eventLog.dir                           /opt/spark/events
