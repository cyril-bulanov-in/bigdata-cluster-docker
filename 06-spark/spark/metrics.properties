# ============================================================================
#  Spark metrics, exposed for Prometheus
# ============================================================================
#  PrometheusServlet serves metrics on the component's own web UI port, on a
#  path that differs per role:
#
#    master   :8080/metrics/master/prometheus
#    worker   :8081/metrics/prometheus
#    driver   :4040/metrics/prometheus
#
#  That per-role path is why the containers carry a prometheus.path label and
#  why docker-sd in 02-monitoring has a relabel rule for __metrics_path__ —
#  the same mechanism MinIO needed.
# ============================================================================

*.sink.prometheusServlet.class=org.apache.spark.metrics.sink.PrometheusServlet
*.sink.prometheusServlet.path=/metrics/prometheus

master.sink.prometheusServlet.path=/metrics/master/prometheus
applications.sink.prometheusServlet.path=/metrics/applications/prometheus

# JVM metrics from every component: heap, garbage collection, threads. The
# usual first place to look when a job is slow for no visible reason.
*.source.jvm.class=org.apache.spark.metrics.source.JvmSource
