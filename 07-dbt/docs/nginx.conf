# ============================================================================
#  Serving the generated documentation
# ============================================================================
#  `dbt docs serve` exists and is not used here. It starts a single-user
#  server that dies with the command, which makes it a development
#  convenience rather than something the platform offers alongside Grafana and
#  the Spark UI.
#
#  Generating static files and putting nginx in front of them costs one small
#  container and makes the documentation a service: it survives, it has an
#  address, and anyone on the network can read it.
# ============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # dbt's docs site is a single-page application: every route is handled by
    # index.html, and a request for a model's page arrives as a path nginx
    # would otherwise answer with 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # manifest.json and catalog.json are the whole site's data — a few MB of
    # JSON fetched on load. Compressing them is the difference between a page
    # that appears and one that appears to hang.
    gzip on;
    gzip_types application/json application/javascript text/css;
    gzip_min_length 1024;

    # No caching. The documentation is regenerated whenever the models change,
    # and a cached manifest from two builds ago is worse than no documentation
    # at all — it describes a project that no longer exists, convincingly.
    add_header Cache-Control "no-store";
}
