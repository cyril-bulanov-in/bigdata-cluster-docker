# ============================================================================
#  PLATFORM — step 7: dbt
# ============================================================================
#
#  dbt itself is not a service: a container runs one model and exits. Two
#  things here are services — the generated documentation, and the parts of
#  Airflow that need to see the project in order to orchestrate it.
#
#  Start:  make up             the platform, and build the dbt image
#          make manifest       let Airflow see the current graph
#          make dbt-build-all  run the models and their tests
#          make docs           generate the documentation and serve it
#  Docs:   http://localhost:8088
# ============================================================================
include:
  - ../06-spark/docker-compose.yml

name: platform

services:

  # ==========================================================================
  #  Airflow, extended rather than redefined
  # ==========================================================================
  #  These three services are defined in 04-etl. Naming them here adds to
  #  those definitions instead of replacing them: compose merges the volume
  #  lists, so everything 04-etl mounts is still mounted.
  #
  #  What is added is the dbt project, read-only. Cosmos builds the task graph
  #  from target/manifest.json at DAG parse time, and reads profiles.yml — it
  #  needs no dbt, no adapter and no database driver, because the models
  #  themselves run in containers from dataplatform/dbt.
  #
  #  All three need it: the dag-processor to parse the DAG, the scheduler and
  #  the api-server to render it.
  # ==========================================================================
  airflow-dag-processor:
    volumes:
      - ./project:/opt/dbt-project:ro

  airflow-scheduler:
    volumes:
      - ./project:/opt/dbt-project:ro

  airflow-apiserver:
    volumes:
      - ./project:/opt/dbt-project:ro

  # ==========================================================================
  #  The documentation site
  # ==========================================================================
  #  Static files produced by `dbt docs generate`, served by nginx.
  #
  #  `dbt docs serve` would be simpler and is deliberately not used: it starts
  #  a single-user server that dies with the command. This survives, has an
  #  address, and sits alongside Grafana and the Spark UI as something the
  #  platform offers rather than something an operator remembers to run.
  # ==========================================================================
  dbt-docs:
    image: nginx:${NGINX_VERSION}
    container_name: dbt-docs
    restart: unless-stopped
    networks: [dataplatform]

    volumes:
      - dbt-docs-site:/usr/share/nginx/html:ro
      - ./docs/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    ports:
      - "${DBT_DOCS_PORT}:80"

    healthcheck:
      # Checks that index.html is actually being served, not merely that nginx
      # answers. Before the first `make docs` the volume is empty and nginx
      # returns 403 for a directory it cannot index — a healthy container
      # serving nothing, which is the state worth distinguishing.
      test: ["CMD-SHELL", "curl -fsS http://localhost/index.html >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  dbt-docs-site:
